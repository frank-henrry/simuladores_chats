<!doctype html>
<html lang="es" data-bs-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="icon" href="data:," />
  <title>Módulo de Chats — Ingreso</title>
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />
  <link href="css/estilos.css" rel="stylesheet" />
</head>
<body>
  <div class="d-flex align-items-center justify-content-center vh-100">
    <div class="card shadow-lg" style="width: 100%; max-width: 380px;">
      <div class="card-body p-4">
        <h1 class="h5 text-center mb-1 fw-bold">Módulo de Chats</h1>
        <p class="text-center text-secondary small mb-4">Acceso de agentes</p>

        <form id="form-login">
          <div class="mb-3">
            <label class="form-label small">Correo</label>
            <input type="email" id="email" class="form-control" placeholder="agente@empresa.com" required autocomplete="username" />
          </div>
          <div class="mb-3">
            <label class="form-label small">Contraseña</label>
            <input type="password" id="password" class="form-control" placeholder="••••••••" required autocomplete="current-password" />
          </div>
          <div id="error-login" class="alert alert-danger py-2 small d-none"></div>
          <button type="submit" id="btn-login" class="btn btn-success w-100 fw-bold">
            <span id="btn-login-spinner" class="spinner-border spinner-border-sm d-none" role="status"></span>
            Iniciar sesión
          </button>
        </form>
      </div>
    </div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/auth.js"></script>
  <script>
    // Si ya hay sesión, ir directo a la bandeja en vez de mostrar el login.
    if (getAccessToken()) window.location.href = 'pages/bandeja.html';

    document.getElementById('form-login').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const errorBox = document.getElementById('error-login');
      const btn = document.getElementById('btn-login');
      const spinner = document.getElementById('btn-login-spinner');

      errorBox.classList.add('d-none');
      btn.disabled = true;
      spinner.classList.remove('d-none');
      try {
        await login(email, password);
        window.location.href = 'pages/bandeja.html';
      } catch (err) {
        errorBox.textContent = err.message;
        errorBox.classList.remove('d-none');
      } finally {
        btn.disabled = false;
        spinner.classList.add('d-none');
      }
    });
  </script>
</body>
</html>
